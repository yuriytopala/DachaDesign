<script>const dict={"uk":{"title":"Публічна оферта","intro":"Умови придбання готових цифрових проєктів та замовлення індивідуальних 3D-проєктів DachaDesign.","sections":[["1. Продавець та сфера дії","Продавець: ФОП Гладій Інна Павлівна, РНОКПП 3339615604. Місцезнаходження: Україна, м. Чернівці. Контактний телефон: +380689992473; email: topala.cv@gmail.com. Ці умови застосовуються до замовлень цифрових проєктів через сайт DachaDesign. До укладення договору покупець має ознайомитися з описом обраного проєкту та цими умовами."],["2. Готові цифрові проєкти","На сайті представлені готові цифрові проєкти. Склад файлів, характеристики та ціна визначаються описом конкретного товару на момент замовлення. Візуалізації є ілюстраціями; фактичний склад матеріалів визначається описом товару."],["3. Індивідуальні 3D-проєкти","Заявка на індивідуальний проєкт сама по собі не означає укладення договору чи виникнення обов’язку оплатити. Обсяг робіт, результат, кількість правок, ціна, строки та порядок оплати узгоджуються з клієнтом окремо до початку виконання."],["4. Замовлення та оплата","Покупець обирає готовий проєкт і проходить оформлення замовлення. Оплата здійснюється доступним на сайті способом, зокрема через платіжний сервіс monobank після його підключення. Замовлення вважається оплаченим після підтвердження успішної транзакції платіжним провайдером. До запуску онлайн-оплати її наявність не гарантується."],["5. Отримання цифрових матеріалів","Після підтвердження оплати готового проєкту покупцю надається доступ до цифрових файлів у форматі, зазначеному в описі замовлення (наприклад, PDF або ZIP). Планований термін доступності повторного завантаження — 30 календарних днів від підтвердження оплати. Якщо файл не отримано або посилання не працює, зверніться до продавця за контактами вище."],["6. Використання проєктів","Якщо інше прямо не погоджено письмово, покупець отримує невиключне право використовувати придбані матеріали для власних потреб. Перепродаж, публічне розповсюдження та передача файлів третім особам для комерційного використання без дозволу правовласника не дозволяються. Права інтелектуальної власності залишаються за їх законними власниками."],["7. Відповідальність і будівництво","Ескізи та візуалізації не замінюють обов’язкової проєктної документації, інженерних розрахунків, дозволів чи перевірки місцевих будівельних норм. Перед будівництвом покупець має за потреби залучити кваліфікованих фахівців для перевірки безпечності конструкції, матеріалів і відповідності умовам ділянки."],["8. Повернення коштів і звернення","Звернення щодо помилкової або подвійної оплати, неотримання файлів, невідповідності опису чи інших питань можна подати через сторінку «Повернення коштів» або на topala.cv@gmail.com. Заяви розглядаються індивідуально відповідно до застосовного законодавства України. Ці умови не обмежують обов’язкових прав споживача, передбачених законом."],["9. Персональні дані","Контактні дані та відомості про замовлення обробляються для оформлення покупки, надання матеріалів, підтримки та розгляду звернень. Докладні умови мають бути викладені в окремій Політиці конфіденційності."],["10. Зміни умов та зв’язок","Продавець може оновлювати цю сторінку. До конкретного замовлення застосовуються умови, доведені до відома покупця під час його оформлення, якщо інше не вимагається законом. Для запитань: topala.cv@gmail.com."]],"home":"На головну","refund":"Повернення коштів","notice":"Проєкт документа для перевірки продавцем перед публікацією. Перевірте фактичний порядок оплати, доставки та відповідність законодавству."},"en":{"title":"Public offer","intro":"Terms for purchasing ready-made digital plans and commissioning custom 3D designs from DachaDesign.","sections":[["1. Seller and scope","Seller: Sole proprietor Hladii Inna Pavlivna, Ukrainian tax ID 3339615604. Location: Chernivtsi, Ukraine. Phone: +380689992473; email: topala.cv@gmail.com. These terms apply to digital design orders through DachaDesign. Customers should review the product description and these terms before placing an order."],["2. Ready-made digital plans","Ready-made digital plans are offered on the website. The included files, specifications and price are those stated in the relevant product listing at the time of ordering. Renderings are illustrative; the product listing defines what is included."],["3. Custom 3D designs","Submitting an enquiry for a custom design does not itself create a contract or an obligation to pay. Scope, deliverables, revisions, price, timeline and payment terms are agreed individually before work begins."],["4. Orders and payment","Customers select a ready-made plan and complete checkout. Payment is made using methods actually available on the website, including monobank payment processing once enabled. An order is paid only after the payment provider confirms the transaction. Online payment is not guaranteed to be available before activation."],["5. Digital delivery","After payment confirmation, access is provided to the digital files in the format specified in the order (such as PDF or ZIP). The intended period for repeat downloads is 30 calendar days from payment confirmation. If files are missing or a link fails, contact the seller."],["6. Permitted use","Unless otherwise agreed in writing, the buyer receives a non-exclusive right to use purchased materials for personal purposes. Resale, public distribution or commercial sharing with third parties without the rights holder’s permission is prohibited. Intellectual property rights remain with their lawful owners."],["7. Construction and safety","Concept drawings and renderings do not replace mandatory construction documents, engineering calculations, permits or checks against local building rules. Before construction, customers should seek qualified professional review as needed for structural safety, materials and site conditions."],["8. Refunds and complaints","Requests concerning mistaken or duplicate payments, undelivered files, discrepancies from the description or other issues may be submitted through the Refunds page or by emailing topala.cv@gmail.com. Each request is reviewed under applicable Ukrainian law. Nothing here limits mandatory consumer rights."],["9. Personal data","Contact details and order information are processed to fulfil purchases, deliver files, provide support and handle requests. More detail should be provided in a separate Privacy Policy."],["10. Updates and contact","The seller may update this page. The terms presented to the customer when placing an order apply to that order, unless the law requires otherwise. Questions: topala.cv@gmail.com."]],"home":"Home","refund":"Refunds","notice":"Draft for seller review before publication. Verify actual payment, delivery processes and legal compliance."},"ru":{"title":"Публичная оферта","intro":"Условия покупки готовых цифровых проектов и заказа индивидуальных 3D-проектов DachaDesign.","sections":[["1. Продавец и сфера действия","Продавец: ФОП Гладій Інна Павлівна, РНОКПП 3339615604. Местонахождение: Украина, г. Черновцы. Телефон: +380689992473; email: topala.cv@gmail.com. Эти условия относятся к заказам цифровых проектов через DachaDesign. Перед заказом покупателю следует ознакомиться с описанием товара и условиями."],["2. Готовые цифровые проекты","На сайте представлены готовые цифровые проекты. Состав файлов, характеристики и цена определяются описанием конкретного товара на момент заказа. Визуализации носят иллюстративный характер; фактический комплект указан в описании."],["3. Индивидуальные 3D-проекты","Подача заявки на индивидуальный проект сама по себе не означает заключения договора или обязанности оплаты. Объём работ, результат, количество правок, стоимость, сроки и порядок оплаты согласовываются с клиентом отдельно до начала работы."],["4. Заказ и оплата","Покупатель выбирает готовый проект и оформляет заказ. Оплата производится доступным на сайте способом, включая сервис monobank после его подключения. Заказ считается оплаченным после подтверждения транзакции платёжным провайдером. До запуска онлайн-оплаты её доступность не гарантируется."],["5. Получение цифровых материалов","После подтверждения оплаты готового проекта покупателю предоставляется доступ к цифровым файлам в указанном в заказе формате (например, PDF или ZIP). Планируемый срок повторного скачивания — 30 календарных дней после подтверждения оплаты. Если файлы не получены или ссылка не работает, свяжитесь с продавцом."],["6. Использование проектов","Если иное прямо не согласовано письменно, покупатель получает неисключительное право использовать материалы для личных нужд. Перепродажа, публичное распространение и коммерческая передача файлов третьим лицам без разрешения правообладателя запрещены. Права интеллектуальной собственности сохраняются за их законными владельцами."],["7. Строительство и безопасность","Эскизы и визуализации не заменяют обязательную проектную документацию, инженерные расчёты, разрешения или проверку местных строительных норм. Перед строительством при необходимости следует привлечь квалифицированных специалистов для проверки безопасности, материалов и условий участка."],["8. Возвраты и обращения","Обращения по ошибочной или двойной оплате, неполученным файлам, несоответствию описанию и другим вопросам можно направить через страницу «Возврат средств» либо на topala.cv@gmail.com. Каждое обращение рассматривается индивидуально по применимому законодательству Украины. Эти условия не ограничивают обязательные права потребителей."],["9. Персональные данные","Контактные данные и сведения о заказах обрабатываются для оформления покупки, предоставления файлов, поддержки и рассмотрения обращений. Подробности должны быть изложены в отдельной Политике конфиденциальности."],["10. Изменение условий и связь","Продавец может обновлять эту страницу. К конкретному заказу применяются условия, доведённые до сведения покупателя при оформлении, если иное не предусмотрено законом. Вопросы: topala.cv@gmail.com."]],"home":"На главную","refund":"Возврат средств","notice":"Проект документа для проверки продавцом перед публикацией. Проверьте фактические способы оплаты, доставки и соответствие законодательству."}};function setLang(l){const d=dict[l]||dict.uk;document.documentElement.lang=l in dict?l:"uk";document.title="DachaDesign — "+d.title;for(const k of ["title","intro","notice","refund","home"])document.getElementById(k).textContent=d[k];const box=document.getElementById("sections");box.replaceChildren();for(const [heading,content] of d.sections){const section=document.createElement("section");section.className="term";const h=document.createElement("h2");h.textContent=heading;const p=document.createElement("p");p.textContent=content;section.append(h,p);box.append(section)}document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===document.documentElement.lang));try{localStorage.setItem("dachadesign-language",document.documentElement.lang)}catch(e){}}document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));let initial="uk";try{initial=localStorage.getItem("dachadesign-language")||"uk"}catch(e){}setLang(initial);</script></body></html>
