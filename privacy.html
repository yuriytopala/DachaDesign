<script>
const dict={"uk": {"title": "Політика конфіденційності", "intro": "Ця політика пояснює, як DachaDesign обробляє персональні дані відвідувачів і покупців.", "updated": "Дата редакції: 15 жовтня 2026 року", "sections": [["Хто обробляє дані", "Продавець та особа, відповідальна за обробку даних: ФОП Гладій Інна Павлівна, Україна, м. Чернівці. З питань персональних даних пишіть на topala.cv@gmail.com або телефонуйте +380 68 999 24 73."], ["Які дані ми отримуємо", "Під час оформлення замовлення: ім’я, контактні дані, обраний проєкт та коментар. Під час звернення щодо повернення: ім’я, email, номер замовлення, причина та коментар. Для індивідуального проєкту ви можете добровільно надати опис ділянки, фотографії та побажання. Сайт також зберігає обрану мову у локальному сховищі браузера (localStorage)."], ["Для чого використовуємо дані", "Щоб відповісти на запит, узгодити індивідуальний проєкт, опрацювати замовлення, забезпечити отримання цифрових матеріалів, розглянути звернення щодо повернення та виконати законні обов’язки продавця. Правовою підставою може бути виконання договору, виконання вимог закону або інша підстава, передбачена законодавством України."], ["Передавання даних та сервіси", "Дані з форм передаються через Cloudflare Worker і надсилаються продавцю повідомленням у Telegram. Тому відповідні дані обробляються також сервісами Cloudflare і Telegram згідно з їхніми правилами. Якщо ви пишете нам електронною поштою, дані обробляються також вашим і нашим поштовими сервісами. Платіжні дані під час онлайн-оплати обробляє платіжний провайдер; не вводьте номер картки або CVV у форми DachaDesign. Обробка сторонніми сервісами може передбачати передачу даних за межі України."], ["Зберігання та безпека", "Ми прагнемо обмежувати доступ до звернень і використовувати дані лише для зазначених цілей. Дані зберігаються протягом часу, необхідного для обробки замовлень, звернень і виконання законних обов’язків. Конкретні строки можуть залежати від виду даних та вимог законодавства. Жоден спосіб передавання інформації через інтернет не гарантує абсолютної безпеки."], ["Ваші права", "Ви можете звернутися щодо доступу до ваших персональних даних, їх виправлення, видалення або заперечення проти обробки — у випадках, передбачених законодавством. Надішліть запит на topala.cv@gmail.com. Для захисту даних ми можемо попросити підтвердити, що звертається саме власник даних."], ["Зміни політики", "Ми можемо оновлювати цю політику. Актуальна редакція публікується на цій сторінці із зазначенням дати."]], "back": "На головну", "contact": "Контактна електронна пошта"}, "en": {"title": "Privacy Policy", "intro": "This policy explains how DachaDesign processes personal information from visitors and customers.", "updated": "Last updated: 15 October 2026", "sections": [["Who processes your data", "The seller and data controller is sole proprietor Hladii Inna Pavlivna, Chernivtsi, Ukraine. For privacy inquiries, email topala.cv@gmail.com or call +380 68 999 24 73."], ["Information we collect", "For orders: name, contact details, selected design and comments. For refund requests: name, email, order number, reason and comments. For custom designs, you may voluntarily provide site descriptions, photos and preferences. The website also stores your selected language in browser localStorage."], ["Why we use information", "To answer inquiries, agree on custom designs, process orders, deliver digital materials, review refund requests and comply with legal obligations. Processing may be based on contract performance, legal obligations or another ground permitted under Ukrainian law."], ["Sharing and service providers", "Form data is sent through a Cloudflare Worker and delivered to the seller as Telegram messages. Cloudflare and Telegram therefore process relevant data under their own policies. Email inquiries also involve the sender’s and recipient’s email services. Online payment details are processed by the payment provider; do not enter card numbers or CVV codes into DachaDesign forms. Third-party processing may involve transfers outside Ukraine."], ["Retention and security", "We aim to limit access to inquiries and use information only for the purposes described. Information is retained as long as needed for orders, inquiries and legal obligations. Specific periods depend on the data and applicable requirements. No internet transmission method is completely secure."], ["Your rights", "You may request access to, correction or deletion of your personal information, or object to processing where permitted by law. Email topala.cv@gmail.com. We may ask you to verify your identity before fulfilling a request."], ["Policy changes", "We may update this policy. The current version and its revision date will appear on this page."]], "back": "Home", "contact": "Contact email"}, "ru": {"title": "Политика конфиденциальности", "intro": "Эта политика объясняет, как DachaDesign обрабатывает персональные данные посетителей и покупателей.", "updated": "Дата редакции: 15 октября 2026 года", "sections": [["Кто обрабатывает данные", "Продавец и лицо, ответственное за обработку данных: ФОП Гладий Инна Павловна, Украина, г. Черновцы. По вопросам персональных данных пишите на topala.cv@gmail.com или звоните +380 68 999 24 73."], ["Какие данные мы получаем", "При заказе: имя, контактные данные, выбранный проект и комментарий. При обращении за возвратом: имя, email, номер заказа, причина и комментарий. Для индивидуального проекта вы можете добровольно предоставить описание участка, фотографии и пожелания. Сайт также сохраняет выбранный язык в локальном хранилище браузера (localStorage)."], ["Зачем используем данные", "Чтобы отвечать на запросы, согласовывать индивидуальные проекты, обрабатывать заказы, предоставлять цифровые материалы, рассматривать возвраты и исполнять законные обязанности продавца. Основанием может быть исполнение договора, требования закона или другое основание, предусмотренное законодательством Украины."], ["Передача данных и сервисы", "Данные из форм передаются через Cloudflare Worker и направляются продавцу сообщением в Telegram. Поэтому соответствующие данные также обрабатываются Cloudflare и Telegram по их правилам. При обращении по электронной почте участвуют почтовые сервисы отправителя и получателя. Платёжные данные при онлайн-оплате обрабатывает платёжный провайдер; не вводите номер карты или CVV в формы DachaDesign. Обработка сторонними сервисами может включать передачу данных за пределы Украины."], ["Хранение и безопасность", "Мы стремимся ограничивать доступ к обращениям и использовать данные только для указанных целей. Данные хранятся столько, сколько необходимо для обработки заказов, обращений и исполнения законных обязанностей. Конкретные сроки зависят от типа данных и требований закона. Ни один способ передачи данных через интернет не гарантирует абсолютной безопасности."], ["Ваши права", "Вы можете запросить доступ к своим данным, их исправление, удаление или возразить против обработки в случаях, предусмотренных законом. Пишите на topala.cv@gmail.com. Для защиты информации мы можем попросить подтвердить вашу личность."], ["Изменения политики", "Мы можем обновлять эту политику. Актуальная редакция и дата её изменения размещаются на этой странице."]], "back": "На главную", "contact": "Контактный email"}};
function setLang(value){const lang=dict[value]?value:'uk';const t=dict[lang];document.documentElement.lang=lang;document.title='DachaDesign — '+t.title;for(const key of ['title','intro','updated'])document.getElementById(key).textContent=t[key];document.getElementById('contactLabel').textContent=t.contact;document.getElementById('back').textContent=t.back;const box=document.getElementById('sections');box.replaceChildren();for(const [heading,body] of t.sections){const section=document.createElement('section');section.className='policy-section';const h=document.createElement('h2');h.textContent=heading;const p=document.createElement('p');p.textContent=body;section.append(h,p);box.append(section)}document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));try{localStorage.setItem('dachadesign-language',lang)}catch(e){}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));let initial='uk';try{initial=localStorage.getItem('dachadesign-language')||'uk'}catch(e){}setLang(initial);
</script></body></html>
